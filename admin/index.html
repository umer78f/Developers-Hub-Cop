<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHC | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <nav>
        <div class="logo">DHC Admin</div>
        <div class="nav-item active" onclick="loadSection('portfolio')"><i class="fas fa-briefcase"></i> Portfolio</div>
        <div class="nav-item" onclick="loadSection('services')"><i class="fas fa-layer-group"></i> Services</div>
        <div class="nav-item" onclick="loadSection('blogs')"><i class="fas fa-blog"></i> Blogs</div>
        <div class="nav-item" onclick="loadSection('leads')"><i class="fas fa-envelope"></i> Leads</div>
        <div class="nav-item" onclick="loadSection('bookings')"><i class="fas fa-calendar-check"></i> Bookings</div>
        <div class="nav-item" onclick="logout()" style="margin-top: auto; color: #da3633;"><i
                class="fas fa-sign-out-alt"></i> Logout</div>
    </nav>

    <main id="app">
        <h1 id="section-title">Portfolio Management</h1>
        <button class="btn btn-add" onclick="openModal()">+ Add New Item</button>
        <div class="card">
            <table>
                <thead>
                    <tr id="table-head"></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Item</h2>
            <form id="modal-form" onsubmit="event.preventDefault(); saveItem();">
                <div id="modal-fields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-add">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
