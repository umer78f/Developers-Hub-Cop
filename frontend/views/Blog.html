<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog/ Developers Hub Corporation</title>
    <link rel="stylesheet" href="/frontend/styles/components.css">
    <link rel="stylesheet" href="/frontend/styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
        integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/frontend/styles/Blog.css">
</head>

<body>
    <div class="wrapper">
        <div id="navbar"></div>

        <!-- BLOG HERO -->
        <section class="blog-hero">
            <div class="container">
                <span class="label">Knowledge Hub</span>
                <h1>Insights & <span class="highlight-text">Innovation</span></h1>
                <p class="hero-sub">Exploring the frontiers of software engineering, artificial intelligence, and global
                    developer culture.</p>
            </div>
        </section>

        <!-- FEATURED POST -->
        <section class="featured-section">
            <div class="container" id="featured-container">
                <!-- Featured post rendered dynamically -->
            </div>
        </section>

        <!-- FILTERS -->
        <section class="blog-filter-section">
            <div class="container">
                <div class="blog-filters">
                    <button class="blog-filter-btn active" data-filter="all">All Stories</button>
                    <button class="blog-filter-btn" data-filter="tech">Tech Trends</button>
                    <button class="blog-filter-btn" data-filter="career">Career</button>
                    <button class="blog-filter-btn" data-filter="community">Community</button>
                </div>
        </section>

        <!-- ARTICLE GRID -->
        <section class="articles-section">
            <div class="container">
                <div class="articles-grid" id="articles-grid">
                    <!-- Articles rendered dynamically -->
                </div>

                <div class="pagination">
                    <button class="btn-secondary" id="load-more-btn">Load More Stories</button>
                </div>
        </section>

        <!-- NEWSLETTER -->
        <section class="newsletter-section">
            <div class="container">
                <div class="newsletter-box">
                    <h2>Stay Ahead of the Curve</h2>
                    <p>Get the latest tech insights delivered directly to your inbox weekly.</p>
                    <div class="subscribe-form">
                        <input type="email" placeholder="Enter your email address">
                        <button class="btn-primary">Subscribe</button>
                    </div>
                </div>
        </section>

        <div id="footer"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
        <script src="/frontend/logic/gsap.js"></script>
        <script src="/frontend/logic/components.js"></script>
        <script src="/frontend/logic/index.js"></script>
        <script>
            const API_BASE = "http://localhost:5000/api";
            const PLACEHOLDER_IMG = "/frontend/assets/intropic.webp";

            let allBlogs = [];
            let visibleCount = 4;
            const LOAD_STEP = 3;

            // Expose reset so index.js can call it when filter changes
            window.resetBlogVisibleCount = function () {
                visibleCount = 4;
                applyFilterAndRender();
            };

            function formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            }

            function renderFeatured(blog) {
                const container = document.getElementById('featured-container');
                if (!blog) {
                    container.innerHTML = '';
                    return;
                }
                const img = blog.image || PLACEHOLDER_IMG;
                container.innerHTML = `
                <div class="featured-card">
                    <div class="featured-img">
                        <img src="${img}" alt="${blog.title}">
                    </div>
                    <div class="featured-content">
                        <span class="post-cat">${blog.category || 'Tech'}</span>
                        <h2>${blog.title}</h2>
                        <p>${blog.excerpt || (blog.content ? blog.content.substring(0, 160) + '...' : '')}</p>
                        <div class="post-meta">
                            <span class="author">By ${blog.author || 'DHC Team'}</span>
                            <span class="date">${formatDate(blog.createdAt)}</span>
                        </div>
                        <a href="blog-detail.html?id=${blog._id}" class="read-more">Read Article <i class="ri-arrow-right-line"></i></a>
                    </div>
            `;
            }

            function renderArticles(blogs) {
                const grid = document.getElementById('articles-grid');
                if (!blogs.length) {
                    grid.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No articles found.</p>';
                    return;
                }
                grid.innerHTML = blogs.map(blog => {
                    const img = blog.image || PLACEHOLDER_IMG;
                    const excerpt = blog.excerpt || (blog.content ? blog.content.substring(0, 120) + '...' : '');
                    return `
                    <article class="article-card" data-category="${blog.category || 'tech'}">
                        <div class="article-img">
                            <img src="${img}" alt="${blog.title}">
                        </div>
                        <div class="article-info">
                            <span class="post-cat">${blog.category || 'Tech'}</span>
                            <h3>${blog.title}</h3>
                            <p>${excerpt}</p>
                            <a href="blog-detail.html?id=${blog._id}" class="article-link">Continue Reading</a>
                        </div>
                    </article>
                `;
                }).join('');
            }

            function getFilteredBlogs() {
                const activeFilter = document.querySelector('.blog-filter-btn.active')?.getAttribute('data-filter') || 'all';
                if (activeFilter === 'all') return allBlogs;
                return allBlogs.filter(b => (b.category || 'tech') === activeFilter);
            }

            function updateLoadMoreButton(filteredLength) {
                const btn = document.getElementById('load-more-btn');
                if (visibleCount >= filteredLength) {
                    btn.style.display = 'none';
                } else {
                    btn.style.display = 'inline-block';
                }
            }

            function applyFilterAndRender() {
                // Always show featured (most recent) regardless of filter
                if (allBlogs.length > 0) {
                    renderFeatured(allBlogs[0]);
                } else {
                    renderFeatured(null);
                }

                const rest = allBlogs.slice(1);
                const activeFilter = document.querySelector('.blog-filter-btn.active')?.getAttribute('data-filter') || 'all';
                let filtered = rest;
                if (activeFilter !== 'all') {
                    filtered = rest.filter(b => (b.category || 'tech') === activeFilter);
                }
                const toShow = filtered.slice(0, visibleCount);
                renderArticles(toShow);
                updateLoadMoreButton(filtered.length);
            }

            function loadMore() {
                visibleCount += LOAD_STEP;
                applyFilterAndRender();
            }

            document.getElementById('load-more-btn').addEventListener('click', loadMore);

            async function loadBlogs() {
                try {
                    const res = await fetch(`${API_BASE}/blogs`);
                    allBlogs = await res.json();

                    if (allBlogs.length > 0) {
                        renderFeatured(allBlogs[0]);
                        const rest = allBlogs.slice(1);
                        const toShow = rest.slice(0, visibleCount);
                        renderArticles(toShow);
                        updateLoadMoreButton(rest.length);
                        initBlogFilters();
                    } else {
                        renderFeatured(null);
                        renderArticles([]);
                        document.getElementById('load-more-btn').style.display = 'none';
                    }
                } catch (err) {
                    console.error('Failed to load blogs:', err);
                    document.getElementById('articles-grid').innerHTML = '<p style="text-align:center; color: var(--text-muted);">Failed to load articles.</p>';
                    document.getElementById('load-more-btn').style.display = 'none';
                }
            }

            loadBlogs();
        </script>
</body>

</html>
