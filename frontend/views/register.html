<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register / Developers Hub Corporation</title>
    <link rel="stylesheet" href="/frontend/styles/components.css">
    <link rel="stylesheet" href="/frontend/styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
        integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/frontend/styles/login-register.css">
</head>

<body>
    <div class="wrapper">
        <div id="navbar"></div>

        <section class="auth-section">
            <div class="auth-container">
                <h1 class="auth-title">Join Developers Hub</h1>
                <p class="auth-subtitle">Create your account to unlock exclusive content and services.</p>

                <form class="auth-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary auth-btn">Register</button>
                </form>

                <p class="auth-footer">Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </section>

        <div id="footer"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
    <script src="/frontend/logic/components.js"></script>
    <script src="/frontend/logic/index.js"></script>
</body>

</html>
