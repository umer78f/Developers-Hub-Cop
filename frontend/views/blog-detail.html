<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog / Developers Hub Corporation</title>
    <link rel="stylesheet" href="/frontend/styles/components.css">
    <link rel="stylesheet" href="/frontend/styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
        integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/frontend/styles/Blog.css">
    <style>
        .blog-detail-hero {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 140px 4rem 4rem;
            position: relative;
            overflow: hidden;
        }

        .blog-detail-hero .hero-bg {
            position: absolute;
            inset: 3.1rem 0 0 0;
            z-index: -1;
        }

        .blog-detail-hero .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
            filter: brightness(0.5);
            border-radius: 2.5rem;
        }

        .blog-detail-hero .post-cat {
            margin-bottom: 15px;
            display: inline-block;
            color: var(--color-success);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(218, 173, 76, 0.15);
            padding: 6px 18px;
            border-radius: 100px;
            border: 1px solid rgba(218, 173, 76, 0.3);
        }

        .blog-detail-hero h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            max-width: 900px;
            margin-bottom: 1.5rem;
        }

        .blog-detail-meta {
            display: flex;
            align-items: center;
            gap: 2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .blog-detail-meta .author {
            color: var(--text-primary);
            font-weight: 600;
        }

        .blog-detail-meta .date {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .blog-detail-body {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 20px 8rem;
            font-size: 1.15rem;
            line-height: 1.85;
            color: var(--text-secondary);
        }

        .blog-detail-body p {
            margin-bottom: 1.8rem;
        }

        .blog-detail-body h2,
        .blog-detail-body h3 {
            color: var(--text-primary);
            margin: 3rem 0 1.2rem;
            font-weight: 600;
        }

        .blog-detail-body h2 {
            font-size: 1.8rem;
        }

        .blog-detail-body h3 {
            font-size: 1.4rem;
        }

        .blog-detail-body blockquote {
            border-left: 3px solid var(--color-success);
            padding-left: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-muted);
        }

        .blog-detail-body img {
            width: 100%;
            border-radius: 16px;
            margin: 2rem 0;
        }

        .blog-detail-body ul,
        .blog-detail-body ol {
            margin: 1.5rem 0;
            padding-left: 1.5rem;
        }

        .blog-detail-body li {
            margin-bottom: 0.6rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--color-success);
        }

        .blog-detail-error {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem;
        }

        .blog-detail-error h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .blog-detail-error p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .blog-detail-hero {
                padding: 120px 20px 3rem;
            }

            .blog-detail-body {
                padding: 2rem 20px 5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <div class="wrapper">
        <div id="blog-detail-content">
            <!-- Content loaded dynamically -->
        </div>
        <div id="footer"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
        <script src="/frontend/logic/gsap.js"></script>
        <script src="/frontend/logic/components.js"></script>
        <script>
            const API_BASE = "http://localhost:5000/api";
            const PLACEHOLDER_IMG = "/frontend/assets/intropic.webp";

            function getParam(name) {
                const url = new URL(window.location.href);
                return url.searchParams.get(name);
            }

            function formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            }

            function renderBlogDetail(blog) {
                const container = document.getElementById('blog-detail-content');
                const img = blog.image || PLACEHOLDER_IMG;

                container.innerHTML = `
                <section class="blog-detail-hero">
                    <div class="hero-bg">
                        <img src="${img}" alt="${blog.title}">
                    </div>
                    <a href="Blog.html" class="back-link"><i class="ri-arrow-left-line"></i> Back to Articles</a>
                    <span class="post-cat">${blog.category || 'Tech'}</span>
                    <h1>${blog.title}</h1>
                    <div class="blog-detail-meta">
                        <span class="author">By ${blog.author || 'DHC Team'}</span>
                        <span class="date"><i class="ri-calendar-line"></i> ${formatDate(blog.createdAt)}</span>
                    </div>
                </section>

                <article class="blog-detail-body">
                    ${blog.content || '<p>No content available.</p>'}
                </article>
            `;
            }

            function renderError() {
                const container = document.getElementById('blog-detail-content');
                container.innerHTML = `
                <section class="blog-detail-error">
                    <h2>Blog Not Found</h2>
                    <p>The article you're looking for doesn't exist or has been removed.</p>
                    <a href="Blog.html" class="btn-primary"><i class="ri-arrow-left-line"></i> Back to Articles</a>
                </section>
            `;
            }

            async function loadBlogDetail() {
                const blogId = getParam('id');
                if (!blogId) {
                    renderError();
                    return;
                }

                try {
                    const res = await fetch(`${API_BASE}/blogs/${blogId}`);
                    if (!res.ok) throw new Error('Not found');
                    const blog = await res.json();
                    renderBlogDetail(blog);
                } catch (err) {
                    console.error('Failed to load blog:', err);
                    renderError();
                }
            }

            // Load blog detail
            loadBlogDetail();
        </script>
</body>

</html>
