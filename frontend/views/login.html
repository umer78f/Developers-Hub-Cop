<![CDATA[<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Developers Hub Corporation</title>
    <link rel="stylesheet" href="/frontend/styles/components.css">
    <link rel="stylesheet" href="/frontend/styles/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
        integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/frontend/styles/login-register.css">
</head>

<body>
    <div class="wrapper">
        <div id="navbar"></div>

        <section class="auth-section">
            <div class="auth-container">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Log in to access your dashboard and project updates.</p>

                <form class="auth-form" id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary auth-btn">Login</button>
                </form>

                <p class="auth-footer">Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </section>

        <div id="footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
    <script src="/frontend/logic/components.js"></script>
    <script>
        const API_BASE = "http://localhost:5000/api";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                return alert('Please enter email and password.');
            }

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    if (data.user.role === 'admin') {
                        localStorage.setItem('adminToken', data.token);
                        alert('Admin login successful!');
                        window.location.href = '/admin/index.html';
                    } else {
                        localStorage.setItem('userToken', data.token);
                        localStorage.setItem('userName', data.user.name);
                        alert('Login successful!');
                        window.location.href = 'Home.html';
                    }
                } else {
                    alert(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (err) {
                alert('Could not connect to the server.');
            }
        });
    </script>
</body>

</html>]]>
